<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14302e" />
  <title>Prontuário rápido</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2314302e' width='16' height='16' rx='3'/%3E%3Cpath fill='%23f4f1ea' d='M4 4h8v1.4H4zm0 3h8v1.4H4zm0 3h5v1.4H4z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <p class="kicker">Leito · UBS / PS</p>
      <h1>Prontuário rápido</h1>
    </div>
    <div class="ctx" role="group" aria-label="Contexto do atendimento">
      <button type="button" id="ctx-ubs" class="ctx-btn on" aria-pressed="true">UBS</button>
      <button type="button" id="ctx-ps" class="ctx-btn" aria-pressed="false">PS / UPA</button>
    </div>
  </header>

  <p class="disclaimer" role="note">
    Apoio à redação, não substitui julgamento clínico. Conferir dose, alergias, gestação, função renal e REMUME local.
  </p>

  <main>
    <section class="panel search-panel">
      <label for="q">Sintomas</label>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Ex.: disúria, tosse, dor facial, chiado" />
      <div id="chips" class="chips"></div>
      <p id="count" class="meta"></p>
      <ul id="results" class="results"></ul>
    </section>

    <section class="panel detail-panel" id="detail">
      <p class="empty">Escolha uma hipótese para montar quadro, conduta e prescrição.</p>
    </section>

    <section class="panel draft-panel">
      <div class="draft-head">
        <label for="draft">Rascunho da evolução</label>
        <span class="meta" id="draft-hint">Edite antes de copiar.</span>
      </div>
      <textarea id="draft" rows="16" spellcheck="true"></textarea>
      <div class="actions">
        <button type="button" id="copy-evo" class="primary">Copiar evolução</button>
        <button type="button" id="copy-rx">Copiar prescrição</button>
        <button type="button" id="copy-cond">Copiar conduta</button>
      </div>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
